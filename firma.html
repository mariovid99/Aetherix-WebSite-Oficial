<!-- Firma de correo Aetherix - Premium Design -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  role="presentation"
  style="
    border-collapse: collapse;
    width: 100%;
    max-width: 600px;
    background: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #10232a;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  "
>
  <!-- Top Gradient Bar -->
  <tr>
    <td
      style="height: 6px; background: linear-gradient(90deg, #0802ea, #5917d2)"
    ></td>
  </tr>

  <!-- Logo + Nombre -->
  <tr>
    <td style="padding: 20px 24px; border-bottom: 1px solid #e6e8eb">
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        role="presentation"
        style="width: 100%"
      >
        <tr>
          <!-- Logo -->
          <td style="width: 90px; vertical-align: middle">
            <img
              src="images/01_Aetherix_Full-Logo.png"
              alt="Aetherix"
              style="display: block; height: 60px; width: auto"
            />
          </td>
          <!-- Nombre y puesto -->
          <td style="vertical-align: middle; padding-left: 100px">
            <div
              style="
                font-size: 20px;
                font-weight: 700;
                color: #10232a;
                letter-spacing: 0.3px;
              "
            >
              Mario Vidaña
            </div>
            <div
              style="
                font-size: 14px;
                font-weight: 500;
                color: #5917d2;
                margin-top: 2px;
              "
            >
              Director de Operaciones
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Datos de contacto -->
  <tr>
    <td style="padding: 16px 24px">
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        role="presentation"
        style="width: 100%; font-size: 14px"
      >
        <tr>
          <td style="color: #767d89; padding: 6px 0; width: 30px">
            <i
              class="fas fa-phone-alt"
              style="color: #1ce080; font-size: 1.1em; margin-right: 6px"
            ></i>
          </td>
          <td style="color: #10232a; font-weight: 700">+52 811-066-6514</td>
        </tr>
        <tr>
          <td>
            <i
              class="fas fa-envelope"
              style="color: #5917d2; font-size: 1.1em; margin-right: 6px"
            ></i>
          </td>

          <td style="color: #0802ea; font-weight: 500">
            <a
              href="mailto:mvidana@aetherix.mx"
              style="color: #0802ea; text-decoration: none; font-weight: 700"
              >mvidana@aetherix.mx</a
            >
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Separador -->
  <tr>
    <td style="height: 1px; background: #e6e8eb"></td>
  </tr>

  <!-- Mensaje de marca -->
  <tr>
    <td style="padding: 16px 24px; background: #f9fafb">
      <div style="font-size: 13px; color: #10232a; margin-bottom: 8px">
        Observe - Predict - Evolve
      </div>
      <div style="font-size: 12px; color: #767d89; line-height: 1.4">
        Este mensaje puede contener información confidencial. Si usted no es el
        destinatario, por favor elimínelo.
      </div>
    </td>
  </tr>

  <!-- Bottom Gradient Bar -->
  <tr>
    <td
      style="height: 5px; background: linear-gradient(90deg, #5917d2, #1ce080)"
    ></td>
  </tr>
</table>
